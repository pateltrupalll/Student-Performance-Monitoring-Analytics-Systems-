{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Apply for Leave</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" name="start_date" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" name="end_date" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Leave Type</label>
                        <select name="leave_type" class="form-control" required>
                            <option value="">Select leave type</option>
                            <option value="Sick">🤒 Sick Leave</option>
                            <option value="Vacation">🏖️ Vacation Leave</option>
                            <option value="Emergency">🚨 Emergency Leave</option>
                            <option value="Other">📝 Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Reason for Leave</label>
                        <textarea name="reason" class="form-control" rows="4" required
                                  placeholder="Please provide detailed reason for your leave..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Submit Leave Application</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
